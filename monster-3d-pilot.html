<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TABOK — 3D Monster Gallery</title><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030204;color:#e8d8bd;font-family:system-ui,sans-serif}body{display:grid;grid-template-rows:auto 1fr;background:radial-gradient(circle at 54% 42%,#2c092d 0,#090408 45%,#010101 100%)}header{z-index:5;display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid #6d392c;background:linear-gradient(#1b0d0c,#080404);box-shadow:0 8px 30px #000}header b{font:700 27px Georgia,serif;color:#f0c879;letter-spacing:.06em}header span{color:#936f68;font-size:9px;letter-spacing:.16em;text-transform:uppercase}header nav{margin-left:auto;display:flex;gap:14px}header a{color:#d8b36e;text-decoration:none;font-size:10px}main{position:relative;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}.caption{position:absolute;left:clamp(15px,4vw,50px);top:clamp(18px,5vh,58px);z-index:2;max-width:305px;pointer-events:none}.caption small{color:var(--monster,#f04dad);font-weight:800;letter-spacing:.2em;text-transform:uppercase}.caption h1{margin:8px 0 5px;font:700 clamp(34px,5vw,65px)/.9 Georgia,serif;color:#e8d0ae;text-shadow:0 3px #2b100e}.caption p{margin:0;color:#a39387;font-size:11px;line-height:1.55}.badge{display:inline-block;margin-top:13px;padding:7px 9px;border:1px solid #68403a;background:#0c0708c9;font-size:8px;letter-spacing:.12em;text-transform:uppercase}.selector{position:absolute;right:clamp(16px,3vw,42px);top:clamp(20px,5vh,58px);z-index:4;display:grid;gap:8px;width:min(230px,28vw)}button{cursor:pointer;min-height:44px;padding:9px 14px;border:1px solid #68463a;background:linear-gradient(#2d1716,#100909);color:#d9c0a0;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.selector button{text-align:left}.selector button strong{display:block;color:#ead7bc;font:700 15px Georgia,serif}.selector button span{display:block;margin-top:3px;color:#806b63;font-size:7px}.selector button.active{border-color:var(--c);box-shadow:0 0 24px color-mix(in srgb,var(--c),transparent 72%);background:linear-gradient(90deg,color-mix(in srgb,var(--c),transparent 78%),#100909)}.controls{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));z-index:4;display:flex;gap:8px;transform:translateX(-50%);padding:7px;border:1px solid #70463f;background:#080505db;backdrop-filter:blur(7px)}.controls button.active{border-color:#eb5bc8;color:#ffd5f5;box-shadow:0 0 18px #b61b8552}.hint{position:absolute;right:16px;bottom:18px;color:#665c5b;font-size:8px;letter-spacing:.08em;text-transform:uppercase}.flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,color-mix(in srgb,var(--monster),transparent 67%),transparent 40%);opacity:0;transition:.35s}.flash.on{opacity:1;transition:.08s}@media(max-width:720px){header span{display:none}header b{font-size:22px}.caption{left:14px;top:14px;max-width:180px}.caption h1{font-size:34px}.caption p{display:none}.selector{right:8px;top:auto;bottom:77px;width:124px}.selector button{min-height:36px;padding:6px}.selector button strong{font-size:10px}.selector button span{display:none}.controls{width:calc(100% - 24px);bottom:max(12px,env(safe-area-inset-bottom))}.controls button{flex:1;padding:6px}.hint{display:none}}
</style></head><body><header><b>TABOK</b><span>3D Creature Laboratory</span><nav><a href="./character-3d-pilot.html">Travelers</a><a href="./">Game</a></nav></header><main><canvas id="view"></canvas><div class="flash"></div><div class="caption"><small id="title">Riftback · Minor Threat</small><h1 id="name">Minor Monster</h1><p id="description"></p><span class="badge" id="stats">Calculating geometry</span></div><div class="selector" id="selector"></div><div class="controls"><button id="idle" class="active">Stalking idle</button><button id="summon">Summoning fury</button><button id="reset">Reset view</button></div><div class="hint">Select a monster · drag to orbit · wheel or pinch to zoom</div></main><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{MONSTER_3D,createMonsterPilot}from'./monster-3d-models.js?v=20260906S1';const canvas=document.getElementById('view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x080307,.042);const camera=new THREE.PerspectiveCamera(34,1,.1,60),controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=4.5;controls.maxDistance=16;controls.maxPolarAngle=1.5;scene.add(new THREE.HemisphereLight(0x8f6b91,0x160909,1.45));const key=new THREE.SpotLight(0xff9b62,115,24,.58,.6,1.3);key.position.set(-4,9,6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key,key.target);const rim=new THREE.PointLight(0xee28ff,68,15,2);rim.position.set(4,4,-3);scene.add(rim);const faceLight=new THREE.PointLight(0xff72de,28,10,2);faceLight.position.set(0,4.2,5);scene.add(faceLight);const floor=new THREE.Mesh(new THREE.CylinderGeometry(4.6,5,.3,32),new THREE.MeshStandardMaterial({color:0x10090d,roughness:.9,metalness:.08}));floor.position.y=-.18;floor.receiveShadow=true;scene.add(floor);const ring=new THREE.Mesh(new THREE.RingGeometry(1.7,4.1,48),new THREE.MeshBasicMaterial({color:0x64175d,transparent:true,opacity:.2,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=-.02;scene.add(ring);
const descriptions={minor:'A horned living-boulder predator. Its shell carries unstable rune plates while loose stones orbit the corruption in its body.',major:'The sovereign of the ruined crossing: a towering obsidian figure crowned in bronze and encircled by five levitating rune monoliths.'},selector=document.getElementById('selector');for(const[id,d]of Object.entries(MONSTER_3D)){const b=document.createElement('button');b.dataset.id=id;b.style.setProperty('--c',d.color);b.innerHTML=`<strong>${d.name}</strong><span>${d.title}</span>`;selector.append(b)}let monster,active='minor',mode='idle';const cache=new Map(),idle=document.getElementById('idle'),summon=document.getElementById('summon');function choose(id){if(monster)scene.remove(monster);active=id;const d=MONSTER_3D[id];if(!cache.has(id))cache.set(id,createMonsterPilot(id));monster=cache.get(id);scene.add(monster);monster.userData.setMode(mode);camera.position.set(...d.camera);controls.target.set(...d.target);controls.update();document.documentElement.style.setProperty('--monster',d.color);document.getElementById('name').textContent=d.name;document.getElementById('title').textContent=d.title+(id==='minor'?' · Minor Threat':' · Major Threat');document.getElementById('description').textContent=descriptions[id];let tris=0,pieces=0;monster.traverse(n=>{if(!n.isMesh||!n.geometry)return;pieces++;tris+=n.geometry.index?n.geometry.index.count/3:n.geometry.attributes.position.count/3});document.getElementById('stats').textContent=Math.round(tris).toLocaleString()+' triangles · '+pieces+' lightweight pieces';selector.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const f=document.querySelector('.flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),150)}selector.onclick=e=>{const b=e.target.closest('button');if(b)choose(b.dataset.id)};function setMode(v){mode=v;monster.userData.setMode(v);idle.classList.toggle('active',v==='idle');summon.classList.toggle('active',v==='summon')}idle.onclick=()=>setMode('idle');summon.onclick=()=>setMode('summon');document.getElementById('reset').onclick=()=>choose(active);choose(active);const resize=()=>{const r=canvas.parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()};new ResizeObserver(resize).observe(canvas.parentElement);resize();const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime();monster.userData.update(t);ring.rotation.z=t*.02;controls.update();renderer.render(scene,camera)});
</script></body></html>
