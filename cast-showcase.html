</style></head><body><main><canvas id="view" aria-label="Interactive 3D cast preview"></canvas><header><strong>TABOK</strong><a href="./">Return to game ↗</a></header><section class="copy"><span class="eyebrow">Sculpted Ruins / Cast collection</span><h1 id="name">Loading cast</h1><span id="role" class="eyebrow accent"></span><p id="description"></p><div id="stats"></div><p id="status">Preparing the gallery…</p></section><section class="actions"><label>Animation<select id="action"><option value="idle">Idle</option><option value="move">Move</option><option value="dice">Cast dice</option><option value="take">Take treasure</option><option value="give">Give / throw</option><option value="steal">Plunder</option><option value="receive">Catch</option><option value="rune">Channel Rune</option><option value="victory">Victory</option><option value="portal">Portal leap</option><option value="summon">Monster summon</option></select></label><button id="replay">Replay animation</button><button id="reset">Reset camera</button></section><div class="hint">DRAG TO ORBIT · SCROLL OR PINCH TO INSPECT</div><nav class="roster" id="roster" aria-label="Choose a character or monster"></nav></main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TRAVELER_3D,createTravelerPilot} from './character-3d-travelers.js?v=20260906S1';
import {MONSTER_3D,createMonsterPilot} from './monster-3d-models.js?v=20260906S1';
const entries={...TRAVELER_3D,...MONSTER_3D},canvas=document.querySelector('canvas'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x181a1f);scene.fog=new THREE.Fog(0x181a1f,18,40);const camera=new THREE.PerspectiveCamera(32,1,.1,60),controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=3.8;controls.maxDistance=14;controls.maxPolarAngle=1.52;
scene.add(new THREE.HemisphereLight(0xdce5fa,0x343030,2.0));const key=new THREE.DirectionalLight(0xffe2b9,3.1);key.position.set(-4,6,5);scene.add(key);const rim=new THREE.DirectionalLight(0xb3c5eb,2.5);rim.position.set(4,3,-3);scene.add(rim);const fill=new THREE.DirectionalLight(0xe0dbcf,.75);fill.position.set(0,3,6);scene.add(fill);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(3.3,3.5,.15,64),new THREE.MeshStandardMaterial({color:0x29272b,roughness:.87,metalness:.12}));floor.position.y=-.19;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.2,.009,6,64),new THREE.MeshBasicMaterial({color:0x76634d}));ring.rotation.x=Math.PI/2;ring.position.y=-.107;scene.add(ring);
const shadowCanvas=document.createElement('canvas');shadowCanvas.width=shadowCanvas.height=128;const cx=shadowCanvas.getContext('2d'),gradient=cx.createRadialGradient(64,64,4,64,64,62);gradient.addColorStop(0,'#000c');gradient.addColorStop(.5,'#0007');gradient.addColorStop(1,'#0000');cx.fillStyle=gradient;cx.fillRect(0,0,128,128);const shadow=new THREE.Mesh(new THREE.PlaneGeometry(3,3),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(shadowCanvas),transparent:true,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.y=-.108;scene.add(shadow);
const copy={misty:'Weathered scout armor, a woven scarlet scarf, fitted bracers and a balanced steel dagger.',cliff:'A tailored blue expedition coat, brass spectacles, field tome and leather scroll pack.',paige:'Layered forest robes, a bound braid and a caged amber lantern carried by its handle.',justin:'A broad bronze cuirass, layered pauldrons, fur mantle and an engraved sun shield.',sue:'Dark fitted leathers, articulated gloves, twin daggers and a swept magenta ponytail.',wanday:'A lined violet coat, crystal staff and a stocked expedition pack with hanging vials.',minor:'Overlapping carapace, swept horns, hooked mandibles and articulated clawed legs.',major:'Exposed bone ribs, obsidian armor, a fractured crown and a living rift beneath the sternum.'};
const cache=new Map();let model,selected='justin',mode='idle';
for(const[id,d]of Object.entries(entries)){const button=document.createElement('button');button.textContent=id==='minor'?'Riftback':id==='major'?'Sovereign':d.name;button.dataset.id=id;button.onclick=()=>choose(id);document.querySelector('#roster').append(button);}
function resetCamera(){const minor=selected==='minor',major=selected==='major';camera.position.set(minor?4:4.5,minor?2.8:major?4:3.25,minor?6.3:major?9.6:8.3);controls.target.set(0,minor?1:major?2.7:2.2,0);controls.update();}
function choose(id){if(model)scene.remove(model);selected=id;const d=entries[id];if(!cache.has(id))cache.set(id,MONSTER_3D[id]?createMonsterPilot(id):createTravelerPilot(id));model=cache.get(id);scene.add(model);model.userData.setMode(mode);model.userData.update(0);document.documentElement.style.setProperty('--accent',d.color);document.querySelector('#name').textContent=id==='major'?'Ruin Sovereign':id==='minor'?'Riftback':d.name;document.querySelector('#role').textContent=d.title;document.querySelector('#description').textContent=copy[id];document.querySelector('#stats').textContent=Math.round(model.userData.design.triangles).toLocaleString()+' triangles / '+model.userData.design.draws+' batched parts';document.querySelectorAll('[data-id]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));status.textContent='Live 3D model';resetCamera();}
document.querySelector('#action').onchange=e=>{mode=e.target.value;model.userData.setMode(mode);};document.querySelector('#replay').onclick=()=>model.userData.setMode(mode);document.querySelector('#reset').onclick=resetCamera;
choose(new URLSearchParams(location.search).get('model') in entries?new URLSearchParams(location.search).get('model'):'justin');
new ResizeObserver(()=>{const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();}).observe(canvas.parentElement);
let frames=0,last=performance.now();const render=t=>{model.userData.update(t/1000);controls.update();renderer.render(scene,camera);frames++;if(t-last>1500){status.textContent='Live 3D model · '+Math.round(frames*1000/(t-last))+' FPS';frames=0;last=t;}};renderer.setAnimationLoop(render);
document.addEventListener('visibilitychange',()=>{frames=0;last=performance.now();renderer.setAnimationLoop(document.hidden?null:render);});
