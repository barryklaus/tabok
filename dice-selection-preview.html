<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TABOK · Choose your dice</title>
<link rel="stylesheet" href="ritual-redesign.css">
<link rel="stylesheet" href="celestial-ui.css">
<link rel="stylesheet" href="dice-selection.css?v=20260916D2">
<style>body{margin:0;min-height:100vh;background:#191520 url(assets/ruin-wall-texture.png) center/700px;color:#eee;font-family:system-ui}.turn-roll-overlay{position:fixed;inset:0;display:grid;place-items:center;box-sizing:border-box}.turn-roll-dialog{box-sizing:border-box}.turn-roll-heading{display:flex}.turn-roll-name{font-family:Georgia,serif}.turn-roll-kicker{text-transform:uppercase}.turn-roll-role{margin-bottom:6px}.preview-inventory{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;font-size:12px;margin:15px 0;color:#d4c7df}.preview-inventory label{cursor:pointer}</style>
<div class="turn-roll-overlay dice-picking">
  <section class="turn-roll-dialog" aria-label="TABOK dice selection">
    <div class="turn-roll-heading"><div class="turn-roll-copy">
      <div class="turn-roll-kicker">TABOK · THE CROSSING</div>
      <h1 class="turn-roll-name">Choose your dice</h1>
      <div class="turn-roll-role">Movement, treasure, or a little magic.</div>
    </div></div>
    <div class="preview-inventory"><label><input type="checkbox" id="hasRune"> Collected Rune</label><label><input type="checkbox" id="hasTreasure"> Carrying treasure</label></div>
    <div class="turn-roll-status" id="status">Select available dice</div>
    <div id="turnRollDice"></div><div id="turnRollControl"></div>
  </section>
</div>
<script src="dice-selection.js?v=20260916D2"></script>
<script>
  const host=document.getElementById('turnRollDice'),control=document.getElementById('turnRollControl'),status=document.getElementById('status');
  let selection=[],busy=false;
  const hasRune=document.getElementById('hasRune'),hasTreasure=document.getElementById('hasTreasure');
  const allowed=()=>TabokDiceSelection.available({rune:hasRune.checked,inventory:[hasTreasure.checked?1:0,0,0]});
  function toggle(name){if(busy)return;selection=TabokDiceSelection.normalize(selection.includes(name)?selection.filter(value=>value!==name):[...selection,name],allowed());render();host.querySelector('[data-dice-choice="'+name+'"]').focus({preventScroll:true})}
  function render(){selection=TabokDiceSelection.normalize(selection,allowed());TabokDiceSelection.mount(host,control,selection,toggle,cast,allowed());status.textContent=selection.length?selection.length+' selected · ready to roll':'Select any of your '+allowed().length+' available dice'}
  async function cast(){if(busy||!selection.length)return;busy=true;hasRune.disabled=hasTreasure.disabled=true;status.textContent='Rolling selected dice…';const specs=selection.map(label=>{const faces=TabokDiceSelection.faces[label];return{label,result:faces[Math.floor(Math.random()*faces.length)]}});await TabokDiceSelection.roll(host,control,specs);status.textContent=specs.map(spec=>spec.label+': '+spec.result).join(' · ');busy=false;hasRune.disabled=hasTreasure.disabled=false;host.querySelectorAll('button').forEach(button=>button.disabled=false);control.querySelector('button').disabled=false}
  hasRune.onchange=hasTreasure.onchange=render;
  render();
</script>
</html>
