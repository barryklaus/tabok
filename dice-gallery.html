<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABOK · Reference Dice</title><style>
*{box-sizing:border-box}body{margin:0;background:#09070e;color:#d3be9c;font:13px Georgia,serif}header{padding:20px 25px;border-bottom:1px solid #493748;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:18px;font-weight:400;letter-spacing:.2em;margin:0}nav{display:flex;flex-wrap:wrap;gap:7px}button,a{padding:9px 13px;color:#dcc3a0;border:1px solid #614766;background:#17111d;text-decoration:none;cursor:pointer;font:11px system-ui}button[aria-pressed=true]{background:#382442;border-color:#c193d2}#stage{position:relative;height:calc(100dvh - 137px)}canvas{display:block!important;width:100%;height:100%}#host{display:none}footer{text-align:center;padding:10px;font-size:12px;line-height:1.8}#error{color:#ff8787;position:absolute;top:90px}#outcome{letter-spacing:.12em}@media(max-width:680px){header{display:block;height:137px;padding:15px}h1{margin-bottom:14px}#stage{height:calc(100dvh - 210px)}button,a{padding:7px 9px}}
</style><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script></head><body><header><h1>THE DICE OF TABOK</h1><nav><button data-kind="Movement">Movement</button><button data-kind="Treasure">Treasure</button><button data-kind="Action">Offering</button><button data-kind="Offer">D20</button><button id="roll">Roll</button><a href="./">Enter game</a></nav></header><div id="stage"><div id="host"></div></div><footer><div id="outcome">MOVEMENT · THE JOURNEY</div><span>Drag to inspect · Scroll to zoom</span></footer><div id="error" role="alert"></div><script type="module">
import {TabokDice3D} from './true3d-dice.js?v=20260910G2';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
window.addEventListener('error',e=>document.querySelector('#error').textContent=e.message);window.addEventListener('unhandledrejection',e=>document.querySelector('#error').textContent=String(e.reason));
const dice=new TabokDice3D(document.querySelector('#host')),controls=new OrbitControls(dice.camera,dice.canvas);controls.target.set(0,1.05,0);controls.enableDamping=true;controls.minDistance=3.8;controls.maxDistance=15;
let kind='Movement',busy=false;const results={Movement:'6',Treasure:'RELIC',Action:'GIVE',Offer:'20'},captions={Movement:'MOVEMENT · THE JOURNEY',Treasure:'TREASURE · THE EXISTING TABOK ICONS',Action:'OFFERING · GIVE OR TAKE',Offer:'D20 · THE DECIDER'};
function select(value){if(busy)return;kind=value;dice.prepare([{label:kind}], '#eadcf3');dice.dice[0].rotation.set(0,kind==='Treasure'?-Math.PI/2:0,0);dice.camera.position.set(4,4.2,6);controls.target.set(0,1.05,0);controls.update();document.querySelector('#outcome').textContent=captions[kind];document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>select(b.dataset.kind));
document.querySelector('#roll').onclick=async()=>{if(busy)return;busy=true;controls.enabled=false;document.querySelector('#outcome').textContent='CASTING…';await dice.cast([{label:kind,result:results[kind]}],1600,'#eadcf3');document.querySelector('#outcome').textContent=`${captions[kind]} · ${results[kind]}`;busy=false;controls.enabled=true;};
select('Movement');dice.renderer.setAnimationLoop(()=>{controls.update();if(!busy)dice.render();});
</script></body></html>
